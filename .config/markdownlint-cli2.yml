config:
  line-length:
    code_blocks: false
    line_length: 120
    strict: true
    tables: false
  no-duplicate-heading: false
  first-line-heading: false
  single-title:
    front_matter_title: false
gitignore: true
globs:
  - "**/*.md"
  - "!LICENSE.md"
  - "!.git/**"
  - "!.jj/**"
  - "!.serena/**"
  - "!**/symlink_*"
