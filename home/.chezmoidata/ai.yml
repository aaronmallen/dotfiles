ai:
  mcp_servers:
    aaronmallen:
      url: https://aaronmallen.me/mcp
      claude_name: aaronmallen-me
    atlassian:
      url: https://mcp.atlassian.com/v2/mcp
    chrome-devtools:
      command: [npx, -y, chrome-devtools-mcp@latest]
    cloudflare:
      url: https://mcp.cloudflare.com/mcp
    context7:
      url: https://mcp.context7.com/mcp
    datadog:
      url: https://mcp.datadoghq.com/v1/mcp
    everflow:
      url: https://mcp.eflow.team
      header_env_vars:
        X-Api-Key: EVERFLOW_API_KEY
    github:
      url: https://api.githubcopilot.com/mcp/
      bearer_token_env_var: GITHUB_MCP_TOKEN
    gmail:
      url: https://gmailmcp.googleapis.com/mcp/v1
    google-calendar:
      url: https://calendarmcp.googleapis.com/mcp/v1
    google-drive:
      url: https://drivemcp.googleapis.com/mcp/v1
    linear-aaronmallen:
      url: https://mcp.linear.app/mcp
    linear-complish:
      url: https://mcp.linear.app/mcp
    serena:
      command: [serena, start-mcp-server, --project-from-cwd]
      args:
        claude: [--context=claude-code]
        codex: [--context=codex]
        opencode: [--context=ide]
    # Slack does not let clients register themselves; this is the client ID of Slack's own Claude plugin.
    slack:
      url: https://mcp.slack.com/mcp
      oauth_client_id: "1601185624273.8899143856786"
      oauth_callback_port: 3118
  plugins:
    opencode-loop:
      opencode: "@prevalentware/opencode-loop-plugin"
    ponytail:
      marketplace: ponytail
      repo: DietrichGebert/ponytail
      opencode: "@dietrichgebert/ponytail"
